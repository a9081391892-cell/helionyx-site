name: Apply capacity article update

on:
  push:
    branches: [main]
    paths:
      - "deploy/replace-capacity-visuals.py"
      - ".github/workflows/apply-capacity-article.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply article update
        run: python3 deploy/replace-capacity-visuals.py

      - name: Commit generated article
        run: |
          if git diff --quiet; then
            echo "No article changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/pochemu-9800-mah-ne-byvaet-v-akkumulyatore-pylesosa/index.html
          git commit -m "Publish exact artwork in capacity article"
          git push
