name: Deploy HELIONYX to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helionyx-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy website to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'server/' \
            --exclude 'deploy/' \
            ./ "$VPS_USER@$VPS_HOST:/var/www/helionyx/"
          ssh "$VPS_USER@$VPS_HOST" "test -f /var/www/helionyx/index.html"

      - name: Deploy CDEK API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CDEK_CLIENT_ID: ${{ secrets.CDEK_CLIENT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.CDEK_CLIENT_SECRET }}
        run: |
          umask 077
          API_ENV="$RUNNER_TEMP/helionyx-api.env"
          printf 'CDEK_CLIENT_ID=%s\nCDEK_CLIENT_SECRET=%s\nHELIONYX_API_HOST=127.0.0.1\nHELIONYX_API_PORT=8787\n' \
            "$CDEK_CLIENT_ID" "$CDEK_CLIENT_SECRET" > "$API_ENV"

          ssh "$VPS_USER@$VPS_HOST" "mkdir -p /tmp/helionyx-deploy/server /tmp/helionyx-deploy/deploy && rm -rf /tmp/helionyx-deploy/deploy/*"
          rsync -az server/app.py "$VPS_USER@$VPS_HOST:/tmp/helionyx-deploy/server/app.py"
          rsync -az --delete deploy/ "$VPS_USER@$VPS_HOST:/tmp/helionyx-deploy/deploy/"
          scp "$API_ENV" "$VPS_USER@$VPS_HOST:/tmp/helionyx-api.env"
          ssh "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/sbin/helionyx-update-api"
          rm -f "$API_ENV"
