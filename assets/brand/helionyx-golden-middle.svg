<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">HELIONYX — золотая середина</title>
  <desc id="desc">Сравнение дорогого оригинального аккумулятора, надёжного аккумулятора HELIONYX и сомнительных аналогов.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d46a"/>
      <stop offset="0.5" stop-color="#d99a16"/>
      <stop offset="1" stop-color="#fff0a8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d5fff"/>
      <stop offset="1" stop-color="#06399e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#15335b" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15335b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="1125" rx="54" fill="url(#bg)"/>
  <circle cx="450" cy="360" r="300" fill="#0d5fff" opacity="0.035"/>

  <text x="450" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" letter-spacing="1">
    <tspan fill="#d79a17">ЗОЛОТАЯ</tspan><tspan fill="#092b63"> СЕРЕДИНА</tspan>
  </text>
  <text x="450" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#42526b">То, что нужно большинству покупателей</text>
  <line x1="95" y1="170" x2="805" y2="170" stroke="#d9a52b" stroke-width="3" opacity="0.7"/>

  <!-- Left: original -->
  <g filter="url(#softShadow)">
    <rect x="38" y="258" width="230" height="560" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M38 290a32 32 0 0 1 32-32h166a32 32 0 0 1 32 32v120H38z" fill="#202733"/>
    <path d="M104 318l18 20 20-40 20 40 18-20 10 57H94z" fill="url(#gold)" stroke="#fff1aa" stroke-width="3"/>
    <circle cx="104" cy="314" r="7" fill="#ffe88b"/>
    <circle cx="142" cy="292" r="7" fill="#ffe88b"/>
    <circle cx="180" cy="314" r="7" fill="#ffe88b"/>
    <text x="153" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#ffffff">ОРИГИНАЛ</text>

    <g font-family="Arial, Helvetica, sans-serif" fill="#263448">
      <circle cx="78" cy="484" r="24" fill="#202733"/><text x="78" y="492" text-anchor="middle" font-size="24" fill="#f4c44e">₽</text>
      <text x="116" y="476" font-size="21" font-weight="700">Очень дорого</text>
      <text x="116" y="503" font-size="17" fill="#66758a">Высокая цена</text>
      <line x1="64" y1="536" x2="242" y2="536" stroke="#e1e7ef"/>

      <circle cx="78" cy="596" r="24" fill="#202733"/>
      <circle cx="75" cy="592" r="9" fill="none" stroke="#f4c44e" stroke-width="4"/><line x1="83" y1="600" x2="92" y2="609" stroke="#f4c44e" stroke-width="4" stroke-linecap="round"/>
      <text x="116" y="588" font-size="21" font-weight="700">Трудно найти</text>
      <text x="116" y="615" font-size="17" fill="#66758a">Порой недоступно</text>
      <line x1="64" y1="648" x2="242" y2="648" stroke="#e1e7ef"/>

      <circle cx="78" cy="708" r="24" fill="#202733"/>
      <path d="M66 697h25v18H66zM70 692h17v6H70z" fill="none" stroke="#f4c44e" stroke-width="3"/>
      <text x="116" y="694" font-size="20" font-weight="700">Не всегда</text>
      <text x="116" y="720" font-size="20" font-weight="700">оправдан по цене</text>
    </g>
  </g>

  <!-- Right: no-name -->
  <g filter="url(#softShadow)">
    <rect x="632" y="258" width="230" height="560" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M632 290a32 32 0 0 1 32-32h166a32 32 0 0 1 32 32v120H632z" fill="#6b7280"/>
    <path d="M747 300l38 68h-76z" fill="#e5484d" stroke="#ffc4c7" stroke-width="4"/>
    <rect x="741" y="320" width="12" height="27" rx="6" fill="#ffffff"/>
    <circle cx="747" cy="357" r="7" fill="#ffffff"/>
    <text x="747" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#ffffff">ФУФЛО</text>

    <g font-family="Arial, Helvetica, sans-serif" fill="#263448">
      <circle cx="674" cy="484" r="24" fill="#e5484d"/><path d="M665 475l18 18M683 475l-18 18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="712" y="476" font-size="20" font-weight="700">Непонятная</text>
      <text x="712" y="503" font-size="20" font-weight="700">сборка</text>
      <line x1="658" y1="536" x2="836" y2="536" stroke="#e1e7ef"/>

      <circle cx="674" cy="596" r="24" fill="#e5484d"/><path d="M665 587l18 18M683 587l-18 18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="712" y="588" font-size="19" font-weight="700">Сомнительные</text>
      <text x="712" y="615" font-size="19" font-weight="700">элементы</text>
      <line x1="658" y1="648" x2="836" y2="648" stroke="#e1e7ef"/>

      <circle cx="674" cy="708" r="24" fill="#e5484d"/><path d="M665 699l18 18M683 699l-18 18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="712" y="694" font-size="19" font-weight="700">Риск нестабильной</text>
      <text x="712" y="720" font-size="19" font-weight="700">работы</text>
    </g>
  </g>

  <!-- Center: HELIONYX -->
  <g filter="url(#shadow)">
    <rect x="282" y="218" width="336" height="646" rx="38" fill="#ffffff" stroke="url(#gold)" stroke-width="6"/>
    <rect x="299" y="235" width="302" height="612" rx="29" fill="none" stroke="#f7d875" stroke-width="2" opacity="0.8"/>

    <g transform="translate(450 298)">
      <path d="M-42-32h32L4-2h-25l19 34-7-25h25L42 32H8L-5 4h25z" fill="url(#blue)"/>
    </g>
    <text x="450" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="900" letter-spacing="2" fill="#083d9d">HELIONYX</text>
    <line x1="335" y1="398" x2="565" y2="398" stroke="#d7a429" stroke-width="2"/>
    <text x="450" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="900" fill="#082d68">НАДЁЖНО</text>
    <text x="450" y="508" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="900" fill="#082d68">И РАЗУМНО</text>
    <rect x="338" y="530" width="224" height="42" rx="21" fill="url(#gold)"/>
    <text x="450" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#4f3500">То, что доктор прописал</text>

    <g font-family="Arial, Helvetica, sans-serif" fill="#263448">
      <circle cx="344" cy="622" r="23" fill="url(#blue)"/>
      <path d="M333 622l8 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="382" y="616" font-size="20" font-weight="700">Проверенные элементы</text>
      <text x="382" y="643" font-size="16" fill="#66758a">Контроль характеристик</text>

      <circle cx="344" cy="692" r="23" fill="url(#blue)"/>
      <path d="M330 700a17 17 0 1 1 28 0M344 686v-10M344 686l11 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="382" y="686" font-size="20" font-weight="700">Стабильная работа</text>
      <text x="382" y="713" font-size="16" fill="#66758a">Под нагрузкой</text>

      <circle cx="344" cy="762" r="23" fill="url(#blue)"/>
      <path d="M334 751h20v23h-20zM338 746h12v6" fill="none" stroke="#fff" stroke-width="4"/>
      <text x="382" y="756" font-size="20" font-weight="700">Честные характеристики</text>
      <text x="382" y="783" font-size="16" fill="#66758a">Без фантастических цифр</text>
    </g>

    <path d="M450 802l42 18v31c0 34-22 54-42 64-20-10-42-30-42-64v-31z" fill="url(#blue)" stroke="#f4c44e" stroke-width="5"/>
    <path d="M431 852l13 13 27-34" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Balance -->
  <g transform="translate(0 38)">
    <path d="M450 910v76M384 987h132" stroke="#b67a08" stroke-width="12" stroke-linecap="round"/>
    <path d="M133 905h634" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="450" cy="905" r="17" fill="#f4c44e" stroke="#9b6500" stroke-width="4"/>
    <path d="M133 905l-61 108M133 905l61 108M767 905l-61 108M767 905l61 108" stroke="#b67a08" stroke-width="4"/>
    <path d="M50 1013h144c-8 45-136 45-144 0zM706 1013h144c-8 45-136 45-144 0z" fill="#263448" stroke="#d4a027" stroke-width="4"/>
  </g>

  <rect x="74" y="1055" width="752" height="48" rx="24" fill="#ffffff" stroke="#dfe6f0" filter="url(#softShadow)"/>
  <text x="450" y="1086" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#263448">HELIONYX — золотая середина между дорогим оригиналом и сомнительными аналогами</text>
</svg>